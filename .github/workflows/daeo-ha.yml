name: DAEO Home Assistant integration

on:
  push:
    paths:
      - "custom_components/daeo/**"
      - "tests/ha/**"
      - "hacs.json"
      - ".github/workflows/daeo-ha.yml"
  pull_request:
    paths:
      - "custom_components/daeo/**"
      - "tests/ha/**"
      - "hacs.json"
      - ".github/workflows/daeo-ha.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the Home Assistant test harness
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/ha/requirements.txt

      - name: Lint
        run: ruff check custom_components/daeo tests/ha

      - name: Test the integration
        run: pytest tests/ha -q --asyncio-mode=auto
