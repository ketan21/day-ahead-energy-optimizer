name: DAEO v2

on:
  push:
    paths:
      - "src/daeo/**"
      - "custom_components/daeo/**"
      - "tests/daeo/**"
      - "hacs.json"
      - "pyproject.toml"
      - "docs/rebuild-proposal.md"
      - ".github/workflows/daeo-v2.yml"
  pull_request:
    paths:
      - "src/daeo/**"
      - "custom_components/daeo/**"
      - "tests/daeo/**"
      - "hacs.json"
      - "pyproject.toml"
      - "docs/rebuild-proposal.md"
      - ".github/workflows/daeo-v2.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the engine
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/daeo tests/daeo custom_components/daeo

      - name: Test
        run: pytest tests/daeo
